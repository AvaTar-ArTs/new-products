[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workvault-maintenance"
version = "0.1.0"
description = "Observable, resumable maintenance for macOS developer workstations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
wv = "workvault_maintenance.cli:main"

[tool.setuptools.packages.find]
include = ["workvault_maintenance*"]
